[pytest]
# Project root is on the path so that ``backend.app`` is importable.
pythonpath = .
# All async tests use asyncio automatically.
asyncio_mode = auto
# Test discovery
testpaths = tests
# Verbose output — shows individual test names.
addopts = -v --tb=short
markers =
    live: marks tests as requiring live Wazuh/OpenSearch services (deselect with '-m "not live"')
